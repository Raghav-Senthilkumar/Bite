[project]
name = "bite-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raghav-Senthilkumar", email = "s18raghav@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aws-lambda-powertools>=3.35.0",
    "boto3>=1.43.103",
    "pydantic>=2.13.5",
]

[project.scripts]
bite-backend = "bite_backend:main"

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
